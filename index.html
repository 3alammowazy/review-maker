<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>صانع صور المراجعات</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@400;700&family=Noto+Kufi+Arabic:wght@400;600&display=swap" rel="stylesheet">
<style>
/* VOICE: quiet, bookish, a one-person studio tool
   IDEA: a book standing in a lit doorway, the door to its world
   PICTURE: the live canvas, large, first
   COLOUR and TYPE: night room tones from each cover, navy #26397a for controls, Noto Naskh titles, Noto Kufi UI
   LAYOUT: canvas then controls; side by side above 960px */
:root{color-scheme:light dark;--bg:light-dark(#f3f1ec,#0f1218);--card:light-dark(#fffdf9,#181c25);--ink:light-dark(#1b2030,#e6e9f0);--mute:light-dark(#6a6e7b,#98a1b3);--line:light-dark(#e1dccf,#2a3142);--navy:#26397a;--acc:light-dark(#26397a,#9fc0ea);--warn:light-dark(#9a5a00,#f2b45c)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 "Noto Kufi Arabic",system-ui,sans-serif;overflow-x:clip}
header{display:flex;align-items:center;gap:12px;padding:18px max(4vw,16px) 4px}
header img{height:28px}
h1{font-size:19px;margin:0;font-weight:600}
.wrap{display:grid;gap:20px;padding:12px max(4vw,16px) 40px;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.wrap{grid-template-columns:minmax(0,1fr) 340px;align-items:start}}
.stage{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px}
canvas{width:100%;height:auto;display:block;border-radius:8px;background:#111}
.hint{color:var(--mute);font-size:13px;margin:8px 2px 0}
.hint.warn{color:var(--warn)}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:grid;gap:16px}
.lab{font-size:13px;color:var(--mute);margin:0 0 6px;display:block}
.drop{display:block;border:2px dashed var(--line);border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer}
.drop.on,.drop:hover{border-color:var(--acc)}
.drop input{display:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{flex:1 1 100px;min-height:44px;border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:10px;font:inherit;cursor:pointer;padding:6px 8px}
.chip[aria-pressed=true]{background:var(--navy);color:#fff;border-color:var(--navy)}
input[type=text]{width:100%;min-height:44px;font:16px "Noto Naskh Arabic",serif;padding:8px 10px;border:1px solid var(--line);border-radius:10px;background:transparent;color:var(--ink);margin-bottom:10px}
input:focus-visible,button:focus-visible,.drop:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.stars{display:flex;gap:2px}
.stars button{width:44px;height:44px;border:0;background:transparent;font-size:26px;color:#d7b45f;cursor:pointer;padding:0}
.stars button.off{color:var(--line)}
.go{min-height:48px;border:0;border-radius:12px;background:var(--navy);color:#fff;font:600 16px "Noto Kufi Arabic",sans-serif;cursor:pointer}
.note{font-size:13px;color:var(--mute);margin:0}
#textbox[hidden]{display:none}
#out{width:100%;border-radius:8px;margin-top:8px}
</style>
</head>
<body>
<header><img id="hdrlogo" alt="عالم موازٍ"><h1>صانع صور المراجعات</h1></header>
<main class="wrap">
  <section class="stage">
    <canvas id="cv" width="2400" height="1350"></canvas>
    <p class="hint" id="hint">معاينة بغلاف تجريبي. ارفع غلاف كتابك لتبدأ.</p>
  </section>
  <aside class="panel">
    <div><span class="lab">غلاف الكتاب</span>
      <label class="drop" id="drop" tabindex="0">اسحب صورة الغلاف هنا أو اضغط للاختيار<input type="file" id="file" accept="image/*"></label></div>
    <div><span class="lab">الشكل</span>
      <div class="chips" id="modes"><button class="chip" data-v="text" aria-pressed="true">مع العنوان</button><button class="chip" data-v="plain" aria-pressed="false">الكتاب فقط</button></div></div>
    <div><span class="lab">المقاس</span>
      <div class="chips" id="sizes"><button class="chip" data-v="wide" aria-pressed="true">للمقال 16:9</button><button class="chip" data-v="sq" aria-pressed="false">مربع 1:1</button></div></div>
    <div id="textbox">
      <span class="lab">عنوان الكتاب</span><input type="text" id="title" value="عالم يشبهنا">
      <span class="lab">المؤلف</span><input type="text" id="author" value="مجموعة قصصية">
      <span class="lab">التقييم</span><div class="stars" id="stars"></div>
    </div>
    <button class="go" id="save">حفظ الصورة</button>
    <p class="note" id="savenote">الصورة تُصنع على جهازك ولا تُرفع إلى أي مكان.</p>
  </aside>
</main>

  const img=st.cover,a=accent(img),txt=st.mode==='text';
  const wall=tone(a,.085,.5),floor=tone(a,.05,.45),light=tone(a,.72,.7),warm=tone(a,.6,.75),bright=tone(a,.9,.6);
  const hz=Math.round(H*(sq?(txt?.6:.74):.78)),ch=Math.round(H*(sq?(txt?.5:.62):(txt?.74:.72))),B=book(img,ch),bw=B.cw+B.th+4;
  const cx=Math.round(W*(sq?.5:(txt?.7:.5))),bx=cx-bw/2,by=hz-ch;
  ctx.fillStyle=css(wall);ctx.fillRect(0,0,W,H);
  const fg=ctx.createLinearGradient(0,hz,0,H);fg.addColorStop(0,css(floor));fg.addColorStop(1,css(floor.map(v=>v*.4)));ctx.fillStyle=fg;ctx.fillRect(0,hz,W,H-hz);
  glowRect(bx-40*S,by-50*S,bw+80*S,ch+50*S,180*S,css(warm,.95));
  glowRect(bx-6*S,by-8*S,bw+12*S,ch+6*S,34*S,css(bright,.9));
  glowEllipse(cx,hz+40*S,400*S,70*S,90*S,css(light,.6));
  ctx.fillStyle=css(light,.2);ctx.fillRect(0,hz-S,W,2*S);
  const rf=mk(bw,ch),rx=rf.getContext('2d');rx.translate(0,ch);rx.scale(1,-1);rx.drawImage(B.c,0,0);rx.setTransform(1,0,0,1,0,0);rx.globalCompositeOperation='destination-in';const rg=rx.createLinearGradient(0,0,0,ch*.35);rg.addColorStop(0,'rgba(0,0,0,.28)');rg.addColorStop(1,'rgba(0,0,0,0)');rx.fillStyle=rg;rx.fillRect(0,0,bw,ch);
  ctx.drawImage(rf,0,0,bw,Math.min(ch*.35,H-hz),bx,hz+4*S,bw,Math.min(ch*.35,H-hz));
  glowEllipse(cx,hz+2*S,bw/2+10*S,12*S,20*S,'rgba(0,0,0,.75)');
  ctx.drawImage(B.c,bx,by);
  const vg=ctx.createRadialGradient(W/2,H/2,Math.min(W,H)*.35,W/2,H/2,Math.max(W,H)*.75);vg.addColorStop(0,'rgba(0,0,0,0)');vg.addColorStop(1,'rgba(0,0,0,.42)');ctx.fillStyle=vg;ctx.fillRect(0,0,W,H);
  const acc=a.neutral||a.s<.25?'#d7b45f':css(tone(a,.75,.6));
  ctx.direction='rtl';ctx.textBaseline='alphabetic';
  const title=document.getElementById('title').value.trim(),author=document.getElementById('author').value.trim();
  const lw=(sq?190:204)*S,lh=lw*84/360;
  if(txt){
    if(!sq){
      const r=Math.round(W*.47);let y=Math.round(H*.27);
      ctx.textAlign='right';ctx.font=`400 ${22*S}px "Noto Kufi Arabic",sans-serif`;ctx.fillStyle=acc;ctx.fillText('مراجعة',r,y);
      ctx.fillRect(r-60*S,y+14*S,60*S,3*S);y+=86*S;
      if(title){const w=wrap(title,r-70*S,56*S,2);ctx.fillStyle='#fff';w.lines.forEach(l=>{ctx.fillText(l,r,y);y+=w.s*1.35});y-=w.s*.2}
      if(author){ctx.font=`400 ${26*S}px "Noto Kufi Arabic",sans-serif`;ctx.fillStyle='rgba(225,229,238,.85)';ctx.fillText(author,r,y+18*S);y+=70*S}
      if(st.rating){ctx.font=`${34*S}px serif`;ctx.fillStyle=acc;ctx.fillText('★'.repeat(st.rating)+'☆'.repeat(5-st.rating),r,y+10*S)}
      ctx.drawImage(st.logo,70*S,H-62*S-lh,lw,lh);
    } else {
      let y=hz+86*S;ctx.textAlign='center';
      if(title){const w=wrap(title,W-180*S,50*S,2);ctx.fillStyle='#fff';w.lines.forEach(l=>{ctx.fillText(l,W/2,y);y+=w.s*1.3})}
      if(author){ctx.font=`400 ${26*S}px "Noto Kufi Arabic",sans-serif`;ctx.fillStyle='rgba(225,229,238,.85)';ctx.fillText(author,W/2,y+6*S);y+=56*S}
      if(st.rating){ctx.font=`${32*S}px serif`;ctx.fillStyle=acc;ctx.fillText('★'.repeat(st.rating)+'☆'.repeat(5-st.rating),W/2,y+6*S)}
      ctx.drawImage(st.logo,W/2-lw/2,H-56*S-lh,lw,lh);
    }
  } else ctx.drawImage(st.logo,W/2-lw/2,H-62*S-lh,lw,lh);
}
const hint=document.getElementById('hint');
function setCover(src,name){load(src).then(i=>{st.cover=i;st.name=name||'sample';
  if(name){hint.className='hint'+(i.naturalHeight<600?' warn':'');hint.textContent=i.naturalHeight<600?`دقة الغلاف منخفضة (${i.naturalHeight} بكسل ارتفاعًا). ستبدو الصورة ضبابية؛ ابحث عن نسخة أكبر من 1000 بكسل إن أمكن.`:'جاهز. عدّل العنوان والتقييم، ثم احفظ.'}
  draw()}).catch(()=>{hint.className='hint warn';hint.textContent='تعذّر فتح هذه الصورة. جرّب ملف JPG أو PNG.'})}
function pick(f){if(!f||!f.type.startsWith('image/'))return;const r=new FileReader();r.onload=()=>setCover(r.result,f.name.replace(/\.[^.]+$/,''));r.readAsDataURL(f)}
const file=document.getElementById('file'),drop=document.getElementById('drop');
file.addEventListener('change',e=>pick(e.target.files[0]));
drop.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();file.click()}});
['dragover','dragenter'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.add('on')}));
['dragleave','drop'].forEach(t=>drop.addEventListener(t,e=>{e.preventDefault();drop.classList.remove('on')}));
drop.addEventListener('drop',e=>pick(e.dataTransfer.files[0]));
function chips(id,key){document.getElementById(id).addEventListener('click',e=>{const b=e.target.closest('.chip');if(!b)return;[...b.parentNode.children].forEach(c=>c.setAttribute('aria-pressed',c===b));st[key]=b.dataset.v;document.getElementById('textbox').hidden=st.mode!=='text';if(st.cover)draw()})}
chips('modes','mode');chips('sizes','size');
const sb=document.getElementById('stars');
function renderStars(){sb.innerHTML=[1,2,3,4,5].map(n=>`<button type="button" aria-label="${n} من 5" class="${n<=st.rating?'':'off'}" data-n="${n}">★</button>`).join('')}
sb.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const n=+b.dataset.n;st.rating=st.rating===n?0:n;renderStars();if(st.cover)draw()});renderStars();
['title','author'].forEach(id=>document.getElementById(id).addEventListener('input',()=>st.cover&&draw()));
let dl=null;
document.getElementById('save').addEventListener('click',()=>{
  const note=document.getElementById('savenote');
  cv.toBlob(async blob=>{
    const t=document.getElementById('title').value.trim();
    const name='review-'+((st.mode==='text'&&t)||st.name).replace(/[\\/:*?"<>|\s]+/g,'-')+(st.size==='sq'?'-square':'')+'.png';
    if(dl){try{await dl.save({filename:name,data:blob});note.textContent='حُفظت الصورة.';return}catch(e){}}
    const url=URL.createObjectURL(blob);
    if(!window.claude){const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();note.textContent='حُفظت الصورة في مجلد التنزيلات.';return}
    let o=document.getElementById('out');if(!o){o=document.createElement('img');o.id='out';o.alt='صورة المراجعة';note.after(o)}o.src=url;
    note.textContent='لم يتح الحفظ المباشر هنا. اضغط مطوّلًا أو بالزر الأيمن على الصورة أدناه واختر «حفظ الصورة».';
  },'image/png');
});
const fontsReady=document.fonts?Promise.all([document.fonts.load('700 40px "Noto Naskh Arabic"'),document.fonts.load('400 20px "Noto Kufi Arabic"')]).catch(()=>{}):Promise.resolve();
Promise.all([load(svgURL('#ffffff','#ffffff')),fontsReady]).then(([l])=>{st.logo=l;setCover(SAMPLE,null)});
if(window.claude&&claude.use)claude.use('downloads').then(d=>{dl=d}).catch(()=>{});
}
